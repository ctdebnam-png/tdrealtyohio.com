name: Weekly GSC SEO Improvements

on:
  schedule:
    # Every Monday at 8am EST (13:00 UTC)
    - cron: '0 13 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  weekly-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install "google-api-python-client>=2.100.0" "google-auth>=2.23.0"

      - name: Generate weekly GSC report
        id: weekly-report
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_PROPERTY_URL: https://tdrealtyohio.com
        run: |
          python -m gsc weekly-report
          # Check if the report has actionable suggestions
          if python -c "
          import json, sys
          data = json.load(open('output/gsc-reports/weekly_latest.json'))
          sys.exit(0 if data.get('has_actionable') else 1)
          "; then
            echo "has_actionable=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_actionable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload weekly report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-gsc-report-${{ github.run_id }}
          path: output/gsc-reports/
          retention-days: 90

      - name: Apply SEO edits and open PR
        if: steps.weekly-report.outputs.has_actionable == 'true'
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_PROPERTY_URL: https://tdrealtyohio.com
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python -m gsc auto-pr

      - name: Summary
        if: always()
        run: |
          echo "## Weekly GSC SEO Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "output/gsc-reports/$(date +%Y-%m-%d).md" ]; then
            cat "output/gsc-reports/$(date +%Y-%m-%d).md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report generated." >> "$GITHUB_STEP_SUMMARY"
          fi
