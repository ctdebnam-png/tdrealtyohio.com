name: Daily Site Optimizer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  optimize:
    name: Pull, Analyze, and PR On-Site Changes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install ads-bot dependencies
        run: cd ads-bot && npm ci

      - name: Pull all data
        run: cd ads-bot && node pull/index.mjs
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GSC_SITE_URL: https://tdrealtyohio.com
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}

      - name: Run analysis
        run: cd ads-bot && node analyze/daily.mjs

      - name: Generate plan
        run: cd ads-bot && node plan/generate.mjs

      - name: Check for on-site changes
        id: changes
        run: |
          DATE=$(date -d yesterday +%Y-%m-%d)
          PLAN="ops/reports/daily-${DATE}.plan.json"
          if [ -f "$PLAN" ]; then
            # Check if plan has site-level changes
            HAS_CHANGES=$(node -e "
              const p = require('./${PLAN}');
              const total = (p.site?.metadata_edits?.length || 0) +
                (p.site?.broken_link_fixes?.length || 0) +
                (p.site?.nav_parity_fixes?.length || 0);
              console.log(total > 0 ? 'true' : 'false');
            ")
            echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Regenerate sitemap
        if: steps.changes.outputs.has_changes == 'true'
        run: node scripts/build.mjs

      - name: Run quality checks
        if: steps.changes.outputs.has_changes == 'true'
        run: npm run check:all

