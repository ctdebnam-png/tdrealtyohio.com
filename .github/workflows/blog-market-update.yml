name: Generate Market Update Posts

on:
  workflow_dispatch:
    inputs:
      community:
        description: 'Specific community slug (leave blank for all)'
        required: false
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate market updates
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          cd scripts
          if [ -n "${{ github.event.inputs.community }}" ]; then
            python generate_blog.py --type market --community "${{ github.event.inputs.community }}"
          else
            python generate_blog.py --type market
          fi

      - name: Commit and push
        run: |
          git config user.name "TD Realty Blog Bot"
          git config user.email "bot@tdrealtyohio.com"
          git add blog/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto: Market update $(date +%Y-%m-%d)"
            git push
          fi
