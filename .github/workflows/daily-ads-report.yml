name: Daily Ads Report

on:
  schedule:
    - cron: '30 11 * * *'  # 06:30 AM America/New_York (11:30 UTC)
  workflow_dispatch:

jobs:
  daily-report:
    name: Pull Data & Generate Report
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ads-bot dependencies
        run: cd ads-bot && npm ci

      - name: Pull data from APIs
        run: cd ads-bot && node pull/index.mjs
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GSC_SITE_URL: https://tdrealtyohio.com
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}

      - name: Run daily analysis
        run: cd ads-bot && node analyze/daily.mjs

      - name: Generate daily plan
        run: cd ads-bot && node plan/generate.mjs

      - name: Upload snapshots as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-snapshots-${{ github.run_id }}
          path: ops/snapshots/
          retention-days: 30

      - name: Upload reports as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-reports-${{ github.run_id }}
          path: ops/reports/
          retention-days: 90

      - name: Read report content
        id: report
        run: |
          DATE=$(date -d yesterday +%Y-%m-%d)
          if [ -f "ops/reports/daily-${DATE}.md" ]; then
            # Truncate to 65000 chars for GitHub issue body limit
            BODY=$(head -c 65000 "ops/reports/daily-${DATE}.md")
            echo "body<<REPORTEOF" >> $GITHUB_OUTPUT
            echo "$BODY" >> $GITHUB_OUTPUT
            echo "REPORTEOF" >> $GITHUB_OUTPUT
            echo "has_report=true" >> $GITHUB_OUTPUT
          else
            echo "has_report=false" >> $GITHUB_OUTPUT
          fi

      - name: Create or update Daily Ads Actions issue
        if: steps.report.outputs.has_report == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Daily Ads Actions — ${new Date().toISOString().split('T')[0]}`;
            const body = `${{ steps.report.outputs.body }}`;

            // Find existing open issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'ads-bot',
              state: 'open',
              per_page: 1,
            });

            if (issues.length > 0) {
              // Close old issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                state: 'closed',
              });
            }

            // Create new issue
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['ads-bot', 'daily-report'],
            });
