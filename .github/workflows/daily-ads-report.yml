name: Daily Ads Report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily-report:
    name: Pull Data & Generate Report
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ads-bot dependencies
        run: cd ads-bot && npm ci

      - name: Pull data from APIs
        run: cd ads-bot && node pull/index.mjs
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GSC_SITE_URL: https://tdrealtyohio.com
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}

      - name: Run daily analysis
        run: cd ads-bot && node analyze/daily.mjs

      - name: Generate daily plan
        run: cd ads-bot && node plan/generate.mjs

      - name: Upload snapshots as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-snapshots-${{ github.run_id }}
          path: ops/snapshots/
          retention-days: 30

      - name: Upload reports as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-reports-${{ github.run_id }}
          path: ops/reports/
          retention-days: 90

