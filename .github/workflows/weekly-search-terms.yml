name: Weekly Search Terms Analysis

on:
  schedule:
    - cron: '0 14 * * 1'  # Monday 09:00 AM ET (14:00 UTC)
  workflow_dispatch:

jobs:
  search-terms:
    name: Search Terms -> Content Queue
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ads-bot dependencies
        run: cd ads-bot && npm ci

      - name: Pull GSC and Ads data
        run: cd ads-bot && node pull/gsc_pull.mjs && node pull/google_ads_pull.mjs
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GSC_SITE_URL: https://tdrealtyohio.com

      - name: Analyze search terms for content gaps
        run: node scripts/topic-coverage.mjs --weekly
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GSC_SITE_URL: https://tdrealtyohio.com

      - name: Create issues for new pages needed
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Read topic coverage report
            const reportPath = path.join(process.cwd(), 'ops', 'reports', 'topic-coverage.json');
            if (!fs.existsSync(reportPath)) {
              console.log('No topic coverage report found');
              return;
            }

            const report = JSON.parse(fs.readFileSync(reportPath, 'utf-8'));
            const gaps = report.gaps || [];

            for (const gap of gaps.slice(0, 5)) {
              const title = `Content Gap: ${gap.keyword} (${gap.intent}, ${gap.locality})`;
              const body = `## Content Gap Identified\n\n` +
                `- **Keyword:** ${gap.keyword}\n` +
                `- **Intent:** ${gap.intent}\n` +
                `- **Locality:** ${gap.locality}\n` +
                `- **Impressions:** ${gap.impressions}\n` +
                `- **Current Position:** ${gap.position || 'N/A'}\n` +
                `- **Suggested Target URL:** ${gap.targetUrl || 'New page needed'}\n\n` +
                `### Internal Linking Requirements\n` +
                `- Link from relevant hub page (${gap.hubLink || '/sellers/ or /buyers/'})\n` +
                `- Link from city page (${gap.cityLink || '/areas/' + gap.locality + '/'})\n` +
                `- Cross-link to 2 sibling pages\n\n` +
                `_Generated by weekly search terms analysis._`;

              // Check if issue already exists
              const { data: existing } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: 'content-gap',
                state: 'open',
                per_page: 100,
              });

              const alreadyExists = existing.some(i => i.title.includes(gap.keyword));
              if (!alreadyExists) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: ['content-gap', 'ads-bot'],
                });
              }
            }
