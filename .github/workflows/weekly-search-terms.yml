name: Weekly Search Terms Analysis

on:
  workflow_dispatch:

jobs:
  search-terms:
    name: Search Terms -> Content Queue
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ads-bot dependencies
        run: cd ads-bot && npm ci

      - name: Pull GSC and Ads data
        run: cd ads-bot && node pull/gsc_pull.mjs && node pull/google_ads_pull.mjs
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GSC_SITE_URL: https://tdrealtyohio.com

      - name: Analyze search terms for content gaps
        run: node scripts/topic-coverage.mjs --weekly
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GSC_SITE_URL: https://tdrealtyohio.com

