name: SEO Autopilot

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    name: SEO Autopilot Run
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: ./.github/actions/seo-autopilot
        with:
          node_version: '20'
          debug: '0'
        env:
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}

      # ── Always succeed ────────────────────────────────────
      - name: Force success
        if: always()
        run: echo "[seo-autopilot] Workflow complete — exiting 0"
