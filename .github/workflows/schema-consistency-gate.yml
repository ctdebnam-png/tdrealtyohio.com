name: Schema Consistency Gate

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  schema-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run business + schema consistency gate
        run: npm run check:schema-consistency
