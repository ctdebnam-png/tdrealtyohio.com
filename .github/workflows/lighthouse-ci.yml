name: Lighthouse CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Run Lighthouse CI
        run: lhci autorun
        timeout-minutes: 5
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 30

      - name: Comment PR with Lighthouse scores
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const resultsDir = '.lighthouseci';
            const manifestPath = path.join(resultsDir, 'manifest.json');

            if (!fs.existsSync(manifestPath)) {
              console.log('No manifest found');
              return;
            }

            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            let body = '## Lighthouse CI Results :warning:\n\nOne or more pages failed the performance budget thresholds.\n\n';
            body += '| URL | Performance | Accessibility | Best Practices | SEO |\n';
            body += '|-----|------------|---------------|----------------|-----|\n';

            for (const entry of manifest) {
              const result = JSON.parse(fs.readFileSync(entry.jsonPath, 'utf8'));
              const perf = Math.round(result.categories.performance.score * 100);
              const a11y = Math.round(result.categories.accessibility.score * 100);
              const bp = Math.round(result.categories['best-practices'].score * 100);
              const seo = Math.round(result.categories.seo.score * 100);

              const flag = (score, threshold) => score < threshold ? ' :x:' : ' :white_check_mark:';
              const url = entry.url.replace(/https?:\/\/[^/]+/, '');

              body += `| ${url} | ${perf}${flag(perf, 90)} | ${a11y}${flag(a11y, 95)} | ${bp}${flag(bp, 90)} | ${seo}${flag(seo, 95)} |\n`;
            }

            body += '\nThresholds: Performance >= 90, Accessibility >= 95, Best Practices >= 90, SEO >= 95\n';
            body += `\n[Full results](${manifest[0]?.uploadUrl || 'see artifacts'})`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
