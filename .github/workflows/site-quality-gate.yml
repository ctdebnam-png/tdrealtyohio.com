name: Site Quality Gate

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  quality-check:
    name: Quality & Regression Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # ── Static checks (no server needed) ──
      - name: Indexing guard
        run: node scripts/indexing-guard.mjs

      - name: Navigation check
        run: node scripts/check-nav.mjs

      - name: Nav registry consistency
        run: node scripts/check-nav-registry.mjs

      - name: Copy quality check
        run: node scripts/check-copy.mjs

      - name: Template consistency
        run: node scripts/check-templates.js

      - name: Nav and copy consistency
        run: node scripts/check-nav-and-copy.js

      - name: Nav/footer/sitemap consistency
        run: node scripts/check-nav-footer-sitemap.mjs

      - name: Content scan (first-person, vague language)
        run: node scripts/content-scan.js

      - name: SEO validate (robots.txt, sitemap.xml)
        run: node scripts/seo-validate.js

      # ── Server-dependent checks ──
      - name: Start local server
        run: npx wrangler pages dev . --port 8788 &
        env:
          NODE_ENV: test

      - name: Wait for server
        run: npx wait-on http://localhost:8788 --timeout 30000 || sleep 10

      - name: Route smoke test
        run: node scripts/route-smoke.js
        env:
          SMOKE_BASE_URL: http://localhost:8788

      - name: Playwright tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
            screenshots/
          retention-days: 14

      - name: Comment on failed PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Site Quality Gate Failed ❌\n\nOne or more quality checks failed. Please review the Actions log and fix the issues.\n\n---\n_Checks run: indexing guard, nav registry, copy quality, template consistency, content scan, SEO validate, route smoke, Playwright tests._'
            });
