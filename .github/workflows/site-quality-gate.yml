name: Site Quality Gate

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  quality-check:
    name: Quality & Regression Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # ── Static checks (no server needed) ──
      - name: Indexing guard
        run: node scripts/indexing-guard.mjs

      - name: Navigation check
        run: node scripts/check-nav.mjs

      - name: Nav registry consistency
        run: node scripts/check-nav-registry.mjs

      - name: Copy quality check
        run: node scripts/check-copy.mjs

      - name: Template consistency
        run: node scripts/check-templates.js

      - name: Nav and copy consistency
        run: node scripts/check-nav-and-copy.js

      - name: Nav/footer/sitemap consistency
        run: node scripts/check-nav-footer-sitemap.mjs

      - name: Content scan (first-person, vague language)
        run: node scripts/content-scan.js

      - name: SEO validate (robots.txt, sitemap.xml)
        run: node scripts/seo-validate.js

      - name: Build (sitemap + robots from registry)
        run: node scripts/build.mjs

      - name: Duplicate canonical check
        run: node scripts/check-duplicate-canonicals.mjs

      - name: Accessibility button lint
        run: node scripts/check-a11y-buttons.mjs

      - name: Broken link check
        run: node scripts/check-broken-links.mjs

      - name: SEO audit (title/meta/canonical/H1/JSON-LD)
        run: node scripts/check-seo-audit.mjs
        continue-on-error: true

      - name: Orphan page & sitemap drift check
        run: node scripts/check-orphan-sitemap.mjs
        continue-on-error: true

      - name: Topic coverage report
        run: node scripts/topic-coverage.mjs
        continue-on-error: true

      # ── Server-dependent checks ──
      # Playwright owns the dev server via its webServer config.
      # Do NOT start wrangler separately — it causes port conflicts and hangs.
      - name: Route smoke test
        run: |
          npx wrangler pages dev . --port 8788 &
          SERVER_PID=$!
          npx wait-on http://localhost:8788 --timeout 30000
          node scripts/route-smoke.js
          kill $SERVER_PID 2>/dev/null || true
        env:
          SMOKE_BASE_URL: http://localhost:8788

      - name: Playwright tests
        run: npx playwright test
        env:
          CI: true

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
            screenshots/
          retention-days: 14

      - name: Comment on failed PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Site Quality Gate Failed\n\nOne or more quality checks failed. Please review the Actions log and fix the issues.\n\n---\n_Checks run: indexing guard, nav check, nav registry, copy quality, template consistency, nav+copy, nav/footer/sitemap, content scan, SEO validate, SEO audit, orphan/sitemap drift, route smoke, Playwright tests._'
            });
