name: GSC Reports

on:
  schedule:
    # Weekdays at 7am EST (12:00 UTC) — indexing check only
    - cron: "0 12 * * 1-5"
    # Sundays at 8am EST (13:00 UTC) — full reports + feedback + autofix
    - cron: "0 13 * * 0"
  workflow_dispatch:
    inputs:
      report:
        description: "Report type"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - performance
          - indexing
          - sitemap
          - feedback
          - autofix
          - optimizer

permissions:
  contents: write

jobs:
  generate-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install "google-api-python-client>=2.100.0" "google-auth>=2.23.0"

      - name: Determine report type
        id: report-type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "report=${{ inputs.report }}" >> "$GITHUB_OUTPUT"
          elif [ "$(date +%u)" = "7" ]; then
            # Sunday — full reports + autofix
            echo "report=all" >> "$GITHUB_OUTPUT"
          else
            # Weekday — indexing only
            echo "report=indexing" >> "$GITHUB_OUTPUT"
          fi

      - name: Run GSC reports
        if: steps.report-type.outputs.report != 'feedback' && steps.report-type.outputs.report != 'autofix'
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          GSC_PROPERTY_URL: ${{ secrets.GSC_PROPERTY_URL }}
        run: python -m gsc.reports --report "${{ steps.report-type.outputs.report }}" --days 28

      - name: Run feedback report
        if: steps.report-type.outputs.report == 'all' || steps.report-type.outputs.report == 'feedback'
        env:
          GSC_SERVICE_ACCOUNT: ${{ secrets.GSC_SERVICE_ACCOUNT }}
          GSC_PROPERTY_URL: ${{ secrets.GSC_PROPERTY_URL }}
        run: python -m gsc.feedback --days 28

      - name: Run autofix
        if: steps.report-type.outputs.report == 'all' || steps.report-type.outputs.report == 'autofix'
        run: python -m gsc.autofix

      - name: Run site-wide optimizer
        if: steps.report-type.outputs.report == 'all' || steps.report-type.outputs.report == 'optimizer'
        run: python -m gsc.optimizer

      - name: Regenerate sitemap
        if: steps.report-type.outputs.report == 'all' || steps.report-type.outputs.report == 'autofix' || steps.report-type.outputs.report == 'optimizer'
        run: node scripts/generate-sitemap.mjs

      - name: Generate blog briefs
        if: steps.report-type.outputs.report == 'all' || steps.report-type.outputs.report == 'feedback'
        run: node scripts/blog-brief-generator.mjs

      - name: Run competitor analysis (dry run)
        if: steps.report-type.outputs.report == 'all'
        run: node scripts/competitor-analysis.mjs --dry-run

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsc-reports-${{ github.run_id }}
          path: output/
          retention-days: 90

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ sitemap.xml areas/ blog/ compare/ lp/ sellers/ buyers/ \
                  about/ contact/ agents/ testimonials/ faq/ referrals/ \
                  index.html 1-percent-commission/ pre-listing-inspection/ \
                  home-value/ affordability/ sell-and-buy/ sell-only-2-percent/ \
                  privacy/ terms/ fair-housing/ sitemap-page/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: GSC reports + autofix ($(date +%Y-%m-%d))"
            git push
          fi
