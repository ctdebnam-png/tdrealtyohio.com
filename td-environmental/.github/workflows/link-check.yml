name: Link check

# Every source_url and url in /src/data is fetched weekly. A URL that has gone
# dead is a fact that has lost its source, so it is surfaced rather than left
# to rot in the data.
on:
  schedule:
    - cron: '0 11 * * 1' # Mondays, 11:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check every URL and record the date it was checked
        id: links
        run: npm run check:links
        continue-on-error: true

      - name: Commit refreshed verified_at dates
        run: |
          if [ -n "$(git status --porcelain src/data)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data
            git commit -m "chore: refresh verified_at from the weekly link check"
            git push
          else
            echo "No verified_at dates changed."
          fi

      - name: Upload the broken-link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broken-links
          path: reports/broken-links.json
          if-no-files-found: ignore

      # The checker exits non-zero only when a URL reached from a public page is
      # non-2xx. Re-raise that here so the weekly run goes red for a broken
      # public link and stays green for an internal-only one.
      - name: Fail if a public URL is broken
        if: steps.links.outcome == 'failure'
        run: |
          echo "A URL referenced from a public page did not answer 2xx."
          cat reports/broken-links.json
          exit 1
