name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate every data file against its schema
        run: npm run check:data

      - name: Type check
        run: npm run check:astro

      # The build runs the link checker as a prebuild step, then the ORC
      # 4733.16 and link-text checks against the built output.
      - name: Build
        run: npm run build

      - name: Upload the broken-link report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broken-links
          path: reports/broken-links.json
          if-no-files-found: ignore

      - name: Install the browser axe runs in
        run: npx playwright install --with-deps chromium

      - name: Accessibility and content rules
        run: npm run test:a11y

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
