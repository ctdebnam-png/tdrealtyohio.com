# Netlify deploy configuration for the TD Environmental static site.
#
# `npm run build` runs, in order:
#   1. prebuild  -> scripts/check-links.ts   (every URL in /src/data is fetched)
#   2. prebuild  -> scripts/check-data.ts    (Zod validation of every data file)
#   3. astro build
#   4. postcheck -> scripts/check-orc-4733.ts (ORC 4733.16 string check on dist)
#
# Any of those failing fails the deploy. That is intentional: a broken public
# URL or a prohibited title string must never reach production.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# X-Robots-Tag is NOT set here. It is emitted into dist/_headers at build time
# from the IS_PUBLISHED flag in src/lib/site.ts, so that going live is one flag
# and not "one flag plus remember to edit netlify.toml".

# Apex only: no www.
[[redirects]]
  from = "https://www.tdenvironmentalohio.com/*"
  to = "https://tdenvironmentalohio.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/services"
  to = "/services/"
  status = 301

[[redirects]]
  from = "/who-we-serve"
  to = "/who-we-serve/"
  status = 301
