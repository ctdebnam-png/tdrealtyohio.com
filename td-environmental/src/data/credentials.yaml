# credentials.yaml
#
# Certifications, licences, and registrations: what each costs, what it gates,
# and whether it is worth earning.
# Schema: src/schemas/credentials.ts
#
# Shape of one record:
#
# - holder: travis               # travis | kwame | sam | firm
#   name: ""
#   issuing_body: ""
#   url: null
#   prerequisites: []
#   coursework: null
#   exam: null
#   experience_requirement: null
#   cost_initial: null           # USD, or null. Never a plausible-looking guess.
#   cost_maintenance: null       # USD per renewal period, or null
#   time_to_earn: null
#   displayable_on_join: false   # may it be listed on /about/certifications/
#                                # before it is earned? (e.g. carried by someone
#                                # joining the firm)
#   earned_at: null              # ISO date once actually held. Only a credential
#                                # with this date appears in the "Credentials
#                                # held" strip on the public site.
#   license_number: null
#   market_recognition: moderate # gate | strong | moderate | vanity
#   verdict: ""
#   plan_year: null              # 1 = year one, 3 = year three, for /internal/credentials/
#   source_url: null
#   source_note: ""
#   verified_at: null
#   confidence: unverified
#
# /about/certifications/ publishes only records with displayable_on_join: true
# or a non-null earned_at.
#
# Fields shown as "" are required: the schema rejects an empty string, so fill
# them with a real value. Fields shown as null may stay null — and should,
# whenever the value is unknown.
#
# Empty until records are pasted in. Unknown values stay null.
