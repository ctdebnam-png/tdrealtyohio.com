# services.yaml
#
# What the firm sells, what it subcontracts, and what it cannot sell yet.
# Schema: src/schemas/services.ts
#
# Shape of one record:
#
# - slug: ""                     # lowercase kebab-case; becomes /services/<slug>/
#   name: ""                     # rejected at build time if it contains a term
#                                # reserved by ORC 4733.16
#   category: ""
#   description: ""             # page lead; body copy, NOT scanned for ORC terms
#   problem: null                # the buyer's problem, in their words
#   scope: null                  # what the engagement covers
#   meta_description: null       # use when `description` cannot serve as a meta
#                                # description — e.g. it lawfully names a
#                                # client's engineer, which ORC 4733.16 bars
#                                # from a meta description but not from body copy
#   standard: null               # E1527-21 | E1903 | VAP | BUSTR | RCRA | null
#   delivery: in_house           # in_house | subcontracted | blocked
#   blocker: null                # required when delivery is "blocked"
#   typical_buyer_segments: []   # segment values from buyers.yaml
#   deliverable: ""
#   source_url: null
#   source_note: ""
#   verified_at: null
#   confidence: unverified
#
# delivery: blocked renders on /internal/services/ only. It is never built as a
# public page and never enters the sitemap.
#
# Fields shown as "" are required: the schema rejects an empty string, so fill
# them with a real value. Fields shown as null may stay null — and should,
# whenever the value is unknown.
#
# Empty until records are pasted in. Unknown values stay null.
