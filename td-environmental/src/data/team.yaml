# team.yaml
#
# Backs /about/team/. Not one of the seven research domains: it exists because
# the team page cannot be rendered from research data and nothing on it may be
# invented. A person with no photo renders without one rather than with a
# stand-in.
# Schema: src/schemas/team.ts
#
# Shape of one record:
#
# - id: travis                   # travis | kwame | sam; joins to credentials.yaml
#   name: ""
#   role: ""
#   photo: null                  # path under /public, e.g. "/team/travis.jpg"
#   photo_alt: null
#   years_experience: null       # null when unknown. Never rounded up.
#   narrative: null              # a paragraph of real project work
#   certifications: []           # with licence numbers where they exist
#   education: []
#   expertise: []
#   order: 0
#   source_url: null
#   source_note: ""
#   verified_at: null
#   confidence: unverified
#
# Empty until records are pasted in. Unknown values stay null.
